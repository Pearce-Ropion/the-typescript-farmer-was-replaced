name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request makes the run for the previous one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Yarn comes from the packageManager field of package.json, which Corepack installs.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - name: Types
        run: yarn types

      - name: Lint
        run: yarn lint

      - name: Format
        run: yarn format --check

      # Runs every test, and fails if coverage is below 100%.
      - name: Tests and coverage
        run: yarn coverage
